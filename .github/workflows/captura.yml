name: Capturas

# Abre el panel en Windows, lo pone en varios estados y guarda una imagen de
# cada uno (artefacto "capturas"). Sirve para revisar cambios visuales sin
# tener una mesa delante. Se lanza a mano desde la pestana Actions.
on:
  workflow_dispatch:

jobs:
  capturas:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar
        run: dotnet build src/HdmiMirror.csproj -c Release -o out

      - name: Hacer capturas
        shell: pwsh
        run: |
          $dir = Join-Path $PWD 'capturas'
          $p = Start-Process -FilePath out/HdmiMirror.exe -ArgumentList '/capturas', "`"$dir`"" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'El panel no se cerro solo en 60 s' }
          Get-ChildItem $dir | Format-Table Name, Length -AutoSize
          if (Test-Path "$dir/error.txt") { Get-Content "$dir/error.txt"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas/
