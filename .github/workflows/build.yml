name: Compilar

# Compila la app en Windows con .NET 8 en cada cambio de main.
# Si sale en rojo, el codigo no compila: no publiques una version hasta arreglarlo.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Windows + .NET 8
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar
        run: dotnet build src/HdmiMirror.csproj -c Release
